[project]
name = "hytea"
version = "0.9.0"
description = "Hyperparameter Tuning using Evolutionary Algorithms"
authors = [
    { name = "Josef Hamelink" },
    { name = "Shreyansh Sharma" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium[box2d]>=1.2.0",
    "ipykernel>=6.30.1",
    "numpy>=2.3.3",
    "pandas>=2.3.2",
    "randomname>=0.2.1",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "wandb>=0.21.4",
]

[project.scripts]
hytea = "hytea.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
extend-select = [
    "E",  # pycodestyle
    "F",  # pyflakes
    "I",  # isort
]

[tool.ruff.format]
quote-style = "single"

